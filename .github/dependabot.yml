version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # One PR for the whole dev toolchain instead of five.
      dev-tooling:
        dependency-type: development
        patterns:
          - 'pestphp/*'
          - 'phpstan/*'
          - 'larastan/*'
          - 'laravel/pint'
          - 'orchestra/testbench'
    ignore:
      # Which Laravel majors this package supports is a deliberate decision —
      # it drives the test matrix, the README and the minimum PHP version — so
      # it is never something to merge automatically. Testbench majors track
      # Laravel majors, so they follow the same rule.
      - dependency-name: 'illuminate/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'orchestra/testbench'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
