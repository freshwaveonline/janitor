version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # One PR for the whole dev toolchain instead of five.
      dev-tooling:
        dependency-type: development
        patterns:
          - 'pestphp/*'
          - 'phpstan/*'
          - 'larastan/*'
          - 'laravel/pint'
          - 'orchestra/testbench'
    ignore:
      # Major bumps of the framework constraints are a deliberate support
      # decision, not something to merge automatically.
      - dependency-name: 'illuminate/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
