name: static analysis

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - '.github/workflows/static-analysis.yml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - '.github/workflows/static-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpstan-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress
