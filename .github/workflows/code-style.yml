name: code style

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only on purpose. CI reports formatting; it never rewrites or commits
# code on an author's behalf — a push from CI re-triggers CI, invalidates
# review approvals, and hides the change from the person who wrote it.
permissions:
  contents: read

concurrency:
  group: pint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Check formatting
        run: |
          if vendor/bin/pint --test; then
            exit 0
          fi

          echo "::error title=Formatting::Laravel Pint reported violations. Run 'composer format' locally and commit the result."
          echo '### Formatting' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run `composer format` locally and commit the result.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
