name: code style

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: pint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A PR from a fork gets a read-only token; the fix-and-commit step
          # below is skipped for those and the check simply reports.
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Check formatting
        id: check
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Fix formatting
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: vendor/bin/pint

      - name: Commit the fixes
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: apply Laravel Pint'

      - name: Fail when formatting could not be fixed automatically
        if: steps.check.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Run 'composer format' locally and commit the result."
          exit 1
